
name: GitHub Fork Auto Sync

on:
  # 每6个小时执行一次
  schedule:
    - cron: '0 0/6 * * *'

  # 支持手动触发
  workflow_dispatch:

# 不授予默认 GITHUB_TOKEN 仓库权限
# 跨仓库操作使用 FORK_SYNC_TOKEN
permissions: {}

# 防止多个同步任务同时运行
concurrency:
  group: github-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and Sync Forks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Discover and sync all forks
        uses: actions/github-script@v7

        with:
          github-token: ${{ secrets.FORK_SYNC_TOKEN }}

          script: |
            const owner = context.repo.owner;

            console.log(`GitHub account: ${owner}`);

            // =====================================
            // 1. 获取账户全部仓库（自动分页）
            // =====================================

            const repos = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              {
                type: "owner",
                per_page: 100
              }
            );

            // =====================================
            // 2. 筛选 Fork 仓库
            // =====================================

            const forks = repos.filter(repo =>
              repo.fork === true &&
              repo.owner.login.toLowerCase() === owner.toLowerCase()
            );

            console.log(`Total repositories: ${repos.length}`);
            console.log(`Total forks found: ${forks.length}`);

            // =====================================
            // 3. 初始化统计
            // =====================================

            let synced = 0;
            let skipped = 0;
            let conflicts = 0;
            let failed = 0;

            // =====================================
            // 4. 遍历所有 Fork
            // =====================================

            for (const repo of forks) {

              const name = repo.full_name;

              console.log("");
              console.log("====================================");
              console.log(`Repository: ${name}`);
              console.log("====================================");

              // ---------------------------------
              // 4.1 跳过归档仓库
              // ---------------------------------

              if (repo.archived) {
                console.log("SKIP: Repository is archived");
                skipped++;
                continue;
              }

              // ---------------------------------
              // 4.2 获取完整仓库信息
              // ---------------------------------

              let detail;

              try {

                const result = await github.rest.repos.get({
                  owner: repo.owner.login,
                  repo: repo.name
                });

                detail = result.data;

              } catch (error) {

                console.log(
                  `SKIP: Get repository failed: HTTP ${error.status || "unknown"}`
                );

                console.log(error.message);

                skipped++;
                continue;
              }

              // 输出诊断信息
              console.log({
                repository: detail.full_name,
                isFork: detail.fork,
                parent: detail.parent?.full_name || null,
                source: detail.source?.full_name || null,
                defaultBranch: detail.default_branch
              });

              // ---------------------------------
              // 4.3 验证 Fork 状态
              // ---------------------------------

              if (!detail.fork) {
                console.log("SKIP: Repository is not a fork");
                skipped++;
                continue;
              }

              // ---------------------------------
              // 4.4 获取 Upstream
              // ---------------------------------

              const upstream = detail.parent;

              if (!upstream) {

                console.log(
                  "SKIP: Parent repository unavailable"
                );

                skipped++;
                continue;
              }

              console.log(`Upstream: ${upstream.full_name}`);

              // ---------------------------------
              // 4.5 获取默认分支
              // ---------------------------------

              const forkBranch = detail.default_branch;
              const upstreamBranch = upstream.default_branch;

              if (!forkBranch || !upstreamBranch) {

                console.log(
                  "SKIP: Default branch unavailable"
                );

                skipped++;
                continue;
              }

              // 保守策略：分支名称不一致则跳过
              if (forkBranch !== upstreamBranch) {

                console.log(
                  `SKIP: Branch mismatch: ${forkBranch} != ${upstreamBranch}`
                );

                skipped++;
                continue;
              }

              console.log(`Branch: ${forkBranch}`);

              // ---------------------------------
              // 4.6 执行 Upstream 同步
              // ---------------------------------

              try {

                const response =
                  await github.rest.repos.mergeUpstream({
                    owner: repo.owner.login,
                    repo: repo.name,
                    branch: forkBranch
                  });

                console.log(
                  `SUCCESS: ${response.data.message}`
                );

                synced++;

              } catch (error) {

                // 409：存在无法自动解决的冲突
                if (error.status === 409) {

                  console.log(
                    "CONFLICT: Cannot fast-forward automatically. Skipped."
                  );

                  conflicts++;
                  continue;
                }

                // 422：请求无法处理
                if (error.status === 422) {

                  console.log(
                    `UNPROCESSABLE: ${error.message}`
                  );

                  skipped++;
                  continue;
                }

                // 其他异常
                console.log(
                  `FAILED: HTTP ${error.status || "unknown"}`
                );

                console.log(error.message);

                failed++;
              }
            }

            // =====================================
            // 5. 输出同步统计
            // =====================================

            console.log("");
            console.log("====================================");
            console.log("          SYNC SUMMARY");
            console.log("====================================");

            console.log(`Account: ${owner}`);
            console.log(`Total repositories: ${repos.length}`);
            console.log(`Total forks: ${forks.length}`);
            console.log(`Synced: ${synced}`);
            console.log(`Skipped: ${skipped}`);
            console.log(`Conflicts: ${conflicts}`);
            console.log(`Failed: ${failed}`);

            console.log("====================================");

            // 存在真正的执行错误时标记任务失败
            if (failed > 0) {

              core.setFailed(
                `${failed} repository synchronization(s) failed`
              );
            }
