name: GitHub Fork Auto Sync

on:
  # 每 6 小时执行一次
  schedule:
    - cron: "0 */6 * * *"

  # 支持手动触发
  workflow_dispatch:

# GITHUB_TOKEN 只用于中央仓库日志写入
permissions:
  contents: write

# 防止多个同步任务同时运行
concurrency:
  group: github-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and Sync Forks
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # =====================================
      # 1. Checkout 中央管理仓库
      # =====================================

      - name: Checkout central repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # =====================================
      # 2. 设置 Node.js
      # =====================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =====================================
      # 3. 发现并同步所有 Fork
      # =====================================

      - name: Discover and sync all fork branches
        id: sync
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_API_URL: ${{ github.api_url }}
          LOG_FILE: logs/latest-sync.log
          SUMMARY_FILE: ${{ runner.temp }}/fork-sync-summary.md
        run: node scripts/sync-forks.js

      # =====================================
      # 4. 提交最新同步日志
      # 无论同步成功或失败，都尝试保存日志
      # =====================================

      - name: Commit latest sync log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "       LOG COMMIT PROCESS START"
          echo "========================================"

          # 检查日志文件
          if [ ! -f logs/latest-sync.log ]; then
            echo "::warning::Sync log does not exist."
            exit 0
          fi

          # 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 检查当前分支
          echo "Current branch:"
          git branch --show-current

          echo "Current Git status:"
          git status --short

          # 先暂存并提交本地日志，保证后续 rebase 时工作区是干净的
          git add logs/latest-sync.log

          # 检查是否有实际变化
          if git diff --cached --quiet; then
            echo "No log changes detected."
            exit 0
          fi

          echo "Staged changes:"
          git diff --cached --stat

          # 创建提交
          echo "Creating commit..."
          git commit -m "chore: update latest fork sync log"

          # 提交后再同步远程；若远程恰好也有新日志提交，
          # -X theirs 以本次运行生成的新日志为准，避免 rebase 冲突
          BRANCH="${GITHUB_REF_NAME}"
          echo "Target branch: ${BRANCH}"

          git fetch origin "${BRANCH}"
          git rebase -X theirs "origin/${BRANCH}"

          # 推送日志
          echo "Pushing latest log..."
          git push origin "HEAD:refs/heads/${BRANCH}"

          echo "========================================"
          echo "       LOG COMMIT SUCCESS"
          echo "========================================"

      # =====================================
      # 5. 输出 GitHub Actions Summary
      # =====================================

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          SUMMARY="${RUNNER_TEMP}/fork-sync-summary.md"

          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GitHub Fork Sync" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary file was generated." >> "$GITHUB_STEP_SUMMARY"
            echo "Please inspect the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi
